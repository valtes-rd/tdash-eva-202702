<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>マイページ | TicketMarket Demo</title>
  <link rel="stylesheet" href="css/style.css">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <script src="data/master.js"></script>
  <script src="js/app.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/layout.js"></script>

  <div class="page-wrap">
    <div id="mypage-content"></div>
  </div>

  <script>
    let currentTab = "profile", orderFilter = "all", noticeFilter = "all", editing = false;
    const TABS = ["profile", "orders", "favorites", "notices"];

    document.addEventListener("DOMContentLoaded", () => {
      buildPage({ title: I18n.t("マイページ", "My Page") });
      if (!App.requireLogin()) return;
      const t = new URLSearchParams(window.location.search).get("tab");
      if (TABS.includes(t)) currentTab = t;
      renderMyPage();
    });

    // 新着モーダル・詳細モーダルで既読になったら件数と一覧を更新
    document.addEventListener("tm:notices-changed", () => {
      if (!App.isLoggedIn() || !document.getElementById("mypage-tabs")) return;
      updateNoticeCounts();
      if (currentTab === "notices") renderNotices();
    });

    function renderMyPage() {
      const u = App.currentUser();
      const orders = App.getOrders(u.id);
      const upcoming = orders.filter(o => ["purchased", "won"].includes(App.orderStatus(o))).length;
      const lottery = orders.filter(o => App.orderStatus(o) === "lottery").length;

      document.getElementById("mypage-content").innerHTML = `
        <div id="user-summary" class="card" style="padding:22px;margin-bottom:24px;display:flex;align-items:center;gap:20px;flex-wrap:wrap">
          <div id="user-avatar" style="width:64px;height:64px;border-radius:50%;background:var(--primary);color:white;font-size:26px;font-weight:700;display:flex;align-items:center;justify-content:center">${u.name.charAt(0)}</div>
          <div>
            <div id="user-name" style="font-size:22px;font-weight:700;color:var(--accent)">${u.name} ${I18n.t("様", "")}</div>
            <div id="user-email" class="muted" style="font-size:13px">${u.email}</div>
          </div>
          <div style="display:flex;gap:20px;margin-left:auto;text-align:center;flex-wrap:wrap">
            <div><div style="font-size:22px;font-weight:700;color:var(--primary)" id="count-upcoming">${upcoming}</div><div class="muted">${I18n.t("予定のチケット", "Upcoming")}</div></div>
            <div><div style="font-size:22px;font-weight:700;color:var(--purple)" id="count-lottery">${lottery}</div><div class="muted">${I18n.t("抽選申込中", "Lottery")}</div></div>
            <div><div style="font-size:22px;font-weight:700;color:#E11D48" id="count-favorites">${App.getFavoriteEvents().length}</div><div class="muted">${I18n.t("お気に入り", "Favourites")}</div></div>
            <div><div style="font-size:22px;font-weight:700;color:var(--warn)" id="count-notices">${App.unreadNoticeCount()}</div><div class="muted">${I18n.t("未読のお知らせ", "Unread")}</div></div>
            <button id="btn-logout" class="btn btn-secondary btn-sm" style="align-self:center" onclick="App.logout()">${I18n.t("ログアウト", "Log Out")}</button>
          </div>
        </div>

        <div class="tabs" id="mypage-tabs">
          <button class="tab-btn" id="tab-profile" onclick="switchTab('profile')">${I18n.t("👤 ユーザー情報", "👤 Profile")}</button>
          <button class="tab-btn" id="tab-orders" onclick="switchTab('orders')">${I18n.t("🎫 購入チケット", "🎫 My Tickets")}</button>
          <button class="tab-btn" id="tab-favorites" onclick="switchTab('favorites')">${I18n.t("❤️ お気に入り", "❤️ Favourites")}</button>
          <button class="tab-btn" id="tab-notices" onclick="switchTab('notices')">${I18n.t("🔔 お知らせ", "🔔 Notices")}<span id="tab-notice-badge" class="notice-badge hidden"></span></button>
        </div>
        <div id="pane-profile"></div>
        <div id="pane-orders" class="hidden"></div>
        <div id="pane-favorites" class="hidden"></div>
        <div id="pane-notices" class="hidden"></div>`;
      updateNoticeCounts();
      switchTab(currentTab);
    }

    function switchTab(tab) {
      currentTab = tab;
      TABS.forEach(t => {
        document.getElementById("tab-" + t).classList.toggle("active", t === tab);
        document.getElementById("pane-" + t).classList.toggle("hidden", t !== tab);
      });
      const url = new URL(window.location.href); url.searchParams.set("tab", tab); history.replaceState(null, "", url);
      if (tab === "profile") renderProfile();
      if (tab === "orders") renderOrders();
      if (tab === "favorites") renderFavorites();
      if (tab === "notices") { renderNotices(); NoticeUI.showNew(); }
    }

    // ══════════ ユーザー情報 ══════════
    function renderProfile() {
      const u = App.currentUser();
      const pane = document.getElementById("pane-profile");
      const fields = [
        ["name",         I18n.t("氏名", "Name"),           u.name],
        ["kana",         I18n.t("氏名（フリガナ）", "Name (Katakana)"), u.kana],
        ["email",        I18n.t("メールアドレス", "Email"), u.email],
        ["phone",        I18n.t("電話番号", "Phone"),       u.phone],
        ["birthdate",    I18n.t("生年月日", "Date of birth"), App.fmtDateSlash(u.birthdate)],
        ["postal",       I18n.t("郵便番号", "Postal code"), u.postal ? "〒" + u.postal : "-"],
        ["address",      I18n.t("住所", "Address"),         u.address || "-"],
        ["card",         I18n.t("登録クレジットカード", "Registered card"), u.card ? `**** **** **** ${u.card}` : I18n.t("未登録", "Not registered")],
        ["pref",         I18n.t("お住まいの地域", "Region"), u.pref ? I18n.t(u.pref, (REGIONS.flatMap(r => r.prefs).find(p => p[0] === u.pref) || [, u.pref])[1]) : "-"],
        ["occupation",   I18n.t("職業", "Occupation"), (o => o ? I18n.t(o.name, o.en) : "-")(OCCUPATIONS.find(o => o.key === u.occupation))],
        ["interests",    I18n.t("興味のあるジャンル", "Interests"), (u.interests || []).length ? u.interests.map(App.genreName).join("、") : "-"],
        ["newsletter",   I18n.t("メールマガジン", "Newsletter"), u.newsletter === undefined ? "-" : u.newsletter ? I18n.t("受け取る", "Subscribed") : I18n.t("受け取らない", "Not subscribed")],
        ["member-since", I18n.t("会員登録日", "Member since"), App.fmtDateSlash(u.memberSince)],
      ];
      if (!editing) {
        pane.innerHTML = `
          <div class="form-section" style="max-width:760px">
            <h3>${I18n.t("👤 登録情報", "👤 Account Information")}</h3>
            <table class="confirm-table" id="profile-table">
              ${fields.map(([k, label, v]) => `<tr data-field="${k}"><td>${label}</td><td id="profile-${k}">${v}</td></tr>`).join("")}
            </table>
            <div style="margin-top:18px;text-align:right">
              <button id="btn-edit-profile" class="btn btn-primary" onclick="editing=true;renderProfile()">${I18n.t("✏️ 登録情報を変更する", "✏️ Edit Information")}</button>
            </div>
          </div>`;
        return;
      }
      pane.innerHTML = `
        <div class="form-section" style="max-width:760px">
          <h3>${I18n.t("✏️ 登録情報の変更", "✏️ Edit Account Information")}</h3>
          <div class="form-grid-2">
            ${input("name", I18n.t("氏名", "Name"), u.name, I18n.t("必須項目です", "Required"))}
            ${input("kana", I18n.t("氏名（フリガナ）", "Name (Katakana)"), u.kana, I18n.t("全角カタカナで入力してください", "Full-width katakana only"))}
            ${input("email", I18n.t("メールアドレス", "Email"), u.email, I18n.t("正しいメールアドレスを入力してください", "Invalid email"))}
            ${input("phone", I18n.t("電話番号", "Phone"), u.phone, I18n.t("090-1234-5678 の形式で入力してください", "Format: 090-1234-5678"))}
            ${input("postal", I18n.t("郵便番号", "Postal code"), u.postal, I18n.t("123-4567 の形式で入力してください", "Format: 123-4567"))}
            ${input("address", I18n.t("住所", "Address"), u.address, "")}
            ${input("card", I18n.t("クレジットカード番号（デモ・下4桁のみ保存／空欄で変更なし）", "Card number (demo; only last 4 digits stored / blank = unchanged)"), "", I18n.t("16桁の数字で入力してください", "Enter 16 digits"))}
          </div>
          <div id="profile-err" class="alert alert-danger hidden mt-16"></div>
          <div style="display:flex;gap:12px;justify-content:flex-end;margin-top:18px">
            <button id="btn-cancel-edit" class="btn btn-secondary" onclick="editing=false;renderProfile()">${I18n.t("キャンセル", "Cancel")}</button>
            <button id="btn-save-profile" class="btn btn-primary" onclick="saveProfile()">${I18n.t("保存する", "Save")}</button>
          </div>
        </div>`;
    }

    function input(key, label, val, err) {
      return `<div class="form-group" id="g-pf-${key}" ${key === "address" || key === "card" ? 'style="grid-column:1/-1"' : ""}>
        <label for="pf-${key}">${label}</label>
        <input type="text" id="pf-${key}" value="${(val || "").replace(/"/g, "&quot;")}">
        <span class="error-msg">${err}</span></div>`;
    }

    function saveProfile() {
      const v = k => document.getElementById("pf-" + k).value.trim();
      const d = { name: v("name"), kana: v("kana"), email: v("email"), phone: v("phone"), postal: v("postal"), address: v("address") };
      const card = v("card").replace(/[\s-]/g, "");
      const checks = [
        ["name", !!d.name], ["kana", /^[ァ-ヶー　 ]+$/.test(d.kana)],
        ["email", /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(d.email)], ["phone", /^0\d{1,4}-\d{1,4}-\d{3,4}$/.test(d.phone)],
        ["postal", !d.postal || /^\d{3}-\d{4}$/.test(d.postal)], ["card", !card || /^\d{16}$/.test(card)],
      ];
      let ok = true;
      checks.forEach(([k, valid]) => { document.getElementById("g-pf-" + k).classList.toggle("has-error", !valid); if (!valid) ok = false; });
      if (!ok) return;
      if (card) d.card = card.slice(-4);
      const res = App.updateProfile(d);
      if (!res.ok) { const el = document.getElementById("profile-err"); el.textContent = res.msg; el.classList.remove("hidden"); return; }
      editing = false;
      App.showToast(I18n.t("登録情報を更新しました", "Your information has been updated."), "success");
      renderMyPage();
    }

    // ══════════ 購入チケット ══════════
    const FILTERS = {
      all:       () => true,
      upcoming:  s => ["purchased", "won"].includes(s),
      lottery:   s => s === "lottery",
      attended:  s => s === "attended",
      cancelled: s => ["cancelled", "lost"].includes(s),
    };

    function renderOrders() {
      const orders = App.getOrders(App.currentUser().id);
      const count = k => orders.filter(o => FILTERS[k](App.orderStatus(o))).length;
      const labels = {
        all: I18n.t("すべて", "All"), upcoming: I18n.t("購入済み・当選", "Upcoming"), lottery: I18n.t("抽選申込中", "Lottery"),
        attended: I18n.t("観覧済み", "Attended"), cancelled: I18n.t("キャンセル・落選", "Cancelled / Lost"),
      };
      document.getElementById("pane-orders").innerHTML = `
        <div class="filter-bar">
          <div class="chips" id="order-filters">
            ${Object.keys(FILTERS).map(k => `<button class="chip${orderFilter === k ? " active" : ""}" id="order-filter-${k}" onclick="orderFilter='${k}';renderOrders()">${labels[k]} (${count(k)})</button>`).join("")}
          </div>
          <select id="order-sort" style="margin-left:auto" onchange="renderOrderList()">
            <option value="date">${I18n.t("公演日が近い順", "Performance date")}</option>
            <option value="created">${I18n.t("購入日が新しい順", "Newest purchase")}</option>
          </select>
        </div>
        <div id="order-list"></div>`;
      renderOrderList();
    }

    function renderOrderList() {
      const sort = document.getElementById("order-sort").value;
      let orders = App.getOrders(App.currentUser().id).filter(o => FILTERS[orderFilter](App.orderStatus(o)));
      orders.sort(sort === "created" ? (a, b) => b.createdAt.localeCompare(a.createdAt)
        : (a, b) => {
          // 今後の公演を近い順 → 過去の公演を新しい順
          const fa = App.daysUntil(a.date) >= 0, fb = App.daysUntil(b.date) >= 0;
          if (fa !== fb) return fa ? -1 : 1;
          return fa ? a.date.localeCompare(b.date) : b.date.localeCompare(a.date);
        });

      const list = document.getElementById("order-list");
      if (!orders.length) {
        list.innerHTML = `<div class="alert alert-info" id="no-orders">${I18n.t("該当するチケットがありません。", "No tickets found.")}
          <a href="${I18n.urlWith("search.html")}" class="btn btn-primary btn-sm" style="margin-left:10px">${I18n.t("イベントを探す", "Find Events")}</a></div>`;
        return;
      }
      const cls = { purchased: "badge-success", won: "badge-success", attended: "badge-gray", lottery: "badge-purple", lost: "badge-gray", cancelled: "badge-danger" };
      list.innerHTML = `
        <div class="table-wrap card">
          <table class="data-table" id="orders-table">
            <thead><tr>
              <th>${I18n.t("注文番号", "Order No.")}</th><th>${I18n.t("イベント", "Event")}</th><th>${I18n.t("公演日時", "Date")}</th>
              <th>${I18n.t("席種・枚数", "Seat / Qty")}</th><th class="num">${I18n.t("合計", "Total")}</th><th>${I18n.t("ステータス", "Status")}</th><th></th>
            </tr></thead>
            <tbody>
              ${orders.map(o => {
                const s = App.orderStatus(o);
                const showTicket = ["purchased", "won", "attended"].includes(s);
                const e = App.getEvent(o.eventId);
                return `<tr data-order-id="${o.id}" data-order-no="${o.orderNo}" data-order-status="${s}">
                  <td class="order-no nowrap" style="font-size:12px;color:var(--primary);font-weight:700">${o.orderNo}</td>
                  <td class="order-event"><span style="cursor:pointer;font-weight:600" onclick="I18n.open('event.html?id=${o.eventId}','_blank')">${o.eventTitle}</span>
                      <div class="muted order-venue">📍 ${o.venueName}</div></td>
                  <td class="order-date nowrap">${App.fmtDateDow(o.date)}<br><span class="muted">${o.start}${I18n.t("開演", "")}</span></td>
                  <td class="order-seat">${o.seatName}<br><span class="muted order-qty">${I18n.t(`${o.qty}枚`, `${o.qty} ticket(s)`)}</span></td>
                  <td class="order-total num" style="font-weight:700">${App.fmtPrice(o.total)}</td>
                  <td><span class="badge ${cls[s]} order-status">${App.orderStatusLabel(s)}</span></td>
                  <td class="nowrap">
                    <button class="btn btn-secondary btn-sm" id="btn-order-detail-${o.orderNo}" onclick="showOrder('${o.id}', false)">${I18n.t("詳細", "Details")}</button>
                    ${showTicket ? `<button class="btn btn-accent btn-sm" id="btn-ticket-${o.orderNo}" onclick="showOrder('${o.id}', true)">${I18n.t("チケット表示", "Show Ticket")}</button>` : ""}
                    ${App.canCancel(o) ? `<button class="btn btn-danger btn-sm" id="btn-cancel-${o.orderNo}" onclick="cancelOrder('${o.id}')">${s === "lottery" ? I18n.t("申込取消", "Withdraw") : I18n.t("キャンセル", "Cancel")}</button>`
                      : (s === "purchased" ? `<div class="muted" id="no-cancel-${o.orderNo}" style="margin-top:2px">${e && !e.cancellable ? I18n.t("キャンセル不可", "Non-cancellable") : I18n.t("キャンセル期限切れ", "Past deadline")}</div>` : "")}
                  </td>
                </tr>`;
              }).join("")}
            </tbody>
          </table>
        </div>
        <div class="muted mt-8">${I18n.t("※ キャンセルは公演日の3日前 23:59 まで（キャンセル不可のイベントを除く）。抽選申込は受付期間中のみ取消できます。", "* Cancellation is available until 23:59, 3 days before the performance (except non-cancellable events). Lottery entries can be withdrawn during the entry period.")}</div>`;
    }

    // QRコード風の模様（デモ用・決定論的）。3隅に位置検出パターン
    function qrHtml(seed) {
      let h = 2166136261, cells = "";
      for (let i = 0; i < 169; i++) {
        h ^= seed.charCodeAt(i % seed.length) + i; h = Math.imul(h, 16777619) >>> 0;
        const r = Math.floor(i / 13), c = i % 13;
        const br = r < 5 ? r : r > 7 ? r - 8 : -1, bc = c < 5 ? c : c > 7 ? c - 8 : -1;
        const finder = br >= 0 && bc >= 0 && !(r > 7 && c > 7);
        const on = finder ? (br === 0 || br === 4 || bc === 0 || bc === 4 || (br === 2 && bc === 2)) : (h >>> 7) & 1;
        cells += `<i class="${on ? "on" : ""}"></i>`;
      }
      return `<div class="qr">${cells}</div>`;
    }

    function showOrder(orderId, ticketFirst) {
      const o = App.getOrder(orderId);
      const s = App.orderStatus(o);
      const rc = RECEIVE_METHODS.find(r => r.key === o.receive), pm = PAYMENT_METHODS.find(m => m.key === o.payment);
      const rows = [
        ["order-no", I18n.t("注文番号", "Order No."), o.orderNo],
        ["status",   I18n.t("ステータス", "Status"), App.orderStatusLabel(s)],
        ["event",    I18n.t("イベント", "Event"), o.eventTitle],
        ["date",     I18n.t("公演日時", "Date & time"), `${App.fmtDateJP(o.date)} ${I18n.t("開場", "Doors")} ${o.open} ／ ${I18n.t("開演", "Start")} ${o.start}`],
        ["venue",    I18n.t("会場", "Venue"), o.venueName],
        ["seat",     I18n.t("席種", "Seat"), o.seatName],
        ["tickets",  I18n.t("券種・枚数", "Tickets"), o.items.map(i => `${App.typeName(i.typeKey)} ${App.fmtPrice(i.price)} × ${i.qty}`).join("<br>")],
        ["receive",  I18n.t("受取方法", "Pickup"), I18n.t(rc.name, rc.en)],
        ["payment",  I18n.t("支払方法", "Payment"), I18n.t(pm.name, pm.en)],
        ["purchased-at", I18n.t("申込日時", "Ordered at"), new Date(o.createdAt).toLocaleString(I18n.isEN() ? "en-US" : "ja-JP")],
        ...(o.lotteryResultDate && o.saleType === "lottery" ? [["lottery-result", I18n.t("当落発表", "Results"), App.fmtDateJP(o.lotteryResultDate)]] : []),
        ["total",    I18n.t("合計金額", "Total"), App.fmtPrice(o.total)],
      ];

      let ticketHtml = "";
      if (["purchased", "won", "attended"].includes(s)) {
        if (o.receive === "eticket") {
          ticketHtml = App.ticketSeats(o).map(t => `
            <div class="eticket" id="eticket-${t.no}" data-ticket-no="${t.no}">
              <div class="eticket-head"><span>🎫 ${I18n.t("電子チケット", "E-Ticket")} ${t.no}/${o.qty}</span><span>${s === "attended" ? I18n.t("使用済み", "Used") : I18n.t("入場時に提示", "Show at entry")}</span></div>
              <div class="eticket-body" style="${s === "attended" ? "opacity:.5" : ""}">
                ${qrHtml(o.orderNo + "-" + t.no)}
                <div style="font-size:13px">
                  <div style="font-weight:700;font-size:14px">${o.eventTitle}</div>
                  <div>${App.fmtDateDow(o.date)} ${o.start}${I18n.t("開演", "")}／${o.venueName}</div>
                  <div>${o.seatName}／${App.typeName(t.typeKey)}</div>
                  <div class="eticket-seat" id="eticket-seat-${t.no}" style="font-size:16px;font-weight:700;color:var(--primary)">${t.label}</div>
                </div>
              </div>
            </div>`).join("");
        } else if (o.receive === "konbini") {
          ticketHtml = `<div class="alert alert-info" id="konbini-info">🏪 ${I18n.t("コンビニ発券", "Convenience store pickup")}<br>
            ${I18n.t("引換票番号", "Pickup No.")}：<strong id="konbini-no">${String(Math.floor(parseInt(o.id.replace(/\D/g, "").slice(-12) || "1") % 9e12 + 1e12))}</strong><br>
            ${I18n.t(`発券開始：${App.fmtDateJP(App.fmtDate(new Date(new Date(o.date + "T00:00:00").getTime() - 7 * 86400000)))} 10:00〜`, `Pickup from ${App.fmtDateSlash(App.fmtDate(new Date(new Date(o.date + "T00:00:00").getTime() - 7 * 86400000)))} 10:00`)}</div>`;
        } else {
          ticketHtml = `<div class="alert alert-info" id="delivery-info">📦 ${I18n.t("配送", "Delivery")}：〒${o.buyer.postal} ${o.buyer.address}<br>
            ${I18n.t(`発送予定：公演日の約7日前（${App.fmtDateJP(App.fmtDate(new Date(new Date(o.date + "T00:00:00").getTime() - 7 * 86400000)))}頃）`, `Ships about 7 days before the performance`)}</div>`;
        }
      }

      const overlay = document.createElement("div");
      overlay.className = "modal-overlay";
      overlay.id = "order-modal";
      overlay.innerHTML = `
        <div class="modal-box wide">
          <button class="modal-close" id="order-modal-close" onclick="document.getElementById('order-modal').remove()">✕</button>
          <div class="modal-title">${ticketFirst ? I18n.t("🎫 チケット表示", "🎫 Your Tickets") : I18n.t("📄 購入内容の詳細", "📄 Order Details")}</div>
          ${ticketFirst ? ticketHtml : ""}
          <table class="confirm-table" id="order-detail-table">
            ${rows.map(([k, label, v]) => `<tr data-field="${k}" class="${k === "total" ? "total-row" : ""}"><td>${label}</td><td id="order-detail-${k}">${v}</td></tr>`).join("")}
          </table>
          ${ticketFirst ? "" : ticketHtml ? `<div class="mt-16">${ticketHtml}</div>` : ""}
          <div style="text-align:right;margin-top:16px"><button class="btn btn-secondary" id="btn-close-order-modal" onclick="document.getElementById('order-modal').remove()">${I18n.t("閉じる", "Close")}</button></div>
        </div>`;
      overlay.addEventListener("click", e => { if (e.target === overlay) overlay.remove(); });
      document.body.appendChild(overlay);
    }

    function cancelOrder(orderId) {
      const o = App.getOrder(orderId);
      const lottery = App.orderStatus(o) === "lottery";
      const msg = lottery
        ? I18n.t(`申込番号 ${o.orderNo} の抽選申込を取り消しますか？`, `Withdraw lottery entry ${o.orderNo}?`)
        : I18n.t(`注文番号 ${o.orderNo} をキャンセルしますか？\nこの操作は取り消せません。`, `Cancel order ${o.orderNo}?\nThis action cannot be undone.`);
      if (!confirm(msg)) return;
      const res = App.cancelOrder(orderId);
      if (res.ok) { App.showToast(lottery ? I18n.t("抽選申込を取り消しました", "Lottery entry withdrawn.") : I18n.t("キャンセルしました", "Order cancelled."), "success"); renderMyPage(); switchTab("orders"); }
      else App.showToast(res.msg, "error");
    }

    // ══════════ お気に入り ══════════
    function renderFavorites() {
      const list = App.getFavoriteEvents();
      const pane = document.getElementById("pane-favorites");
      if (!list.length) {
        pane.innerHTML = `<div class="alert alert-info" id="no-favorites">
          ${I18n.t("まだお気に入りがありません。イベント詳細画面の「♡ お気に入り」ボタンで追加できます。", 'No favourites yet. Use the "♡ Favorite" button on an event page.')}
          <a href="${I18n.urlWith("search.html")}" class="btn btn-primary btn-sm" style="margin-left:10px">${I18n.t("イベントを探す", "Find Events")}</a></div>`;
        return;
      }
      pane.innerHTML = `<div class="event-grid" id="fav-grid">${list.map(e => eventCardHtml(e, { idPrefix: "fav-", favRemove: true })).join("")}</div>`;
    }

    function removeFav(eventId) {
      App.toggleFavorite(eventId);
      App.showToast(I18n.t("お気に入りを解除しました", "Removed from favourites."), "info");
      document.getElementById("count-favorites").textContent = App.getFavoriteEvents().length;
      renderFavorites();
    }

    // ══════════ お知らせ ══════════
    const NOTICE_FILTERS = {
      all:    () => true,
      unread: n => !n.read,
      ...Object.fromEntries(NOTICE_CATEGORIES.map(c => [c.key, n => n.category === c.key])),
    };

    function updateNoticeCounts() {
      const unread = App.unreadNoticeCount();
      document.getElementById("count-notices").textContent = unread;
      const badge = document.getElementById("tab-notice-badge");
      badge.textContent = unread;
      badge.classList.toggle("hidden", !unread);
    }

    function renderNotices() {
      const all = App.getNotices();
      const unread = all.filter(n => !n.read).length;
      const count = k => all.filter(NOTICE_FILTERS[k]).length;
      const labels = {
        all: I18n.t("すべて", "All"), unread: I18n.t("未読", "Unread"),
        ...Object.fromEntries(NOTICE_CATEGORIES.map(c => [c.key, `${c.emoji} ${I18n.t(c.name, c.en)}`])),
      };
      const list = all.filter(NOTICE_FILTERS[noticeFilter]);
      document.getElementById("pane-notices").innerHTML = `
        <div class="filter-bar">
          <div class="chips" id="notice-filters">
            ${Object.keys(NOTICE_FILTERS).map(k => `<button class="chip${noticeFilter === k ? " active" : ""}" id="notice-filter-${k}" onclick="noticeFilter='${k}';renderNotices()">${labels[k]} (${count(k)})</button>`).join("")}
          </div>
          <button id="btn-notice-read-all" class="btn btn-secondary btn-sm" style="margin-left:auto" ${unread ? "" : "disabled"} onclick="readAllNotices()">${I18n.t("すべて既読にする", "Mark all as read")}</button>
        </div>
        ${!list.length
          ? `<div class="alert alert-info" id="no-notices">${all.length ? I18n.t("該当するお知らせはありません。", "No matching notices.") : I18n.t("お知らせはまだありません。", "You have no notices yet.")}</div>`
          : `<div class="card notice-list" id="notice-list">
              ${list.map(n => `
                <div class="notice-item${n.read ? "" : " unread"}" id="notice-${n.id}" data-notice-id="${n.id}" data-category="${n.category}" data-read="${n.read}" onclick="NoticeUI.open('${n.id}')">
                  <span class="notice-dot" title="${n.read ? I18n.t("既読", "Read") : I18n.t("未読", "Unread")}"></span>
                  <div class="notice-item-main">
                    <div class="notice-item-meta">${NoticeUI.categoryBadge(n)}${n.read ? "" : `<span class="badge badge-danger notice-new">NEW</span>`}<span class="muted notice-date">${NoticeUI.fmtDateTime(n.createdAt)}</span></div>
                    <div class="notice-title">${NoticeUI.esc(App.noticeTitle(n))}</div>
                    <div class="notice-snippet muted">${NoticeUI.esc(App.noticeBody(n).replace(/\s+/g, " "))}</div>
                  </div>
                  <span class="notice-arrow">›</span>
                </div>`).join("")}
            </div>`}`;
    }

    function readAllNotices() {
      App.markAllNoticesRead();
      App.showToast(I18n.t("すべてのお知らせを既読にしました", "All notices marked as read."), "success");
      updateNoticeCounts();
      renderNotices();
    }
  </script>
</body>
</html>
